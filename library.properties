name=ThirdDimension
version=0.2.0
author=Peter D'Angelo <peterdangelo729@gmail.com>
maintainer=Peter D'Angelo <peterdangelo729@gmail.com>
sentence=Tiny scene-based 3D renderer for 32-bit microcontrollers, in the spirit of Adafruit GFX.
paragraph=Scene, orbit/auto-fit camera, directional lights, meshes from an OBJ converter or eight procedural primitives, painter-sorted Gouraud shading, cel (toon) shading with banded fills and switchable outline ink, feature-line outline rendering (silhouette, crease, and boundary ink with hidden-line removal), and ten switchable 1-bit dither methods, drawn through a small render-target seam (1-bit pixel callback, RGB565 framebuffer, or optional Adafruit GFX adapters). Requires a 32-bit MCU with hardware float (Teensy 4.x, ESP32, STM32F4+, RP2350); not for AVR.
category=Display
url=https://github.com/dangelo729/third_dimension
architectures=*
