  const sx = new Float64Array(n), sy = new Float64Array(n);
  for (let i = 0; i < n; ++i) {
    if (p.kind === "ortho") {
      const s = orthoToScreen(p, geo.wverts[i]);
      sx[i] = s[0];
      sy[i] = s[1];
    } else {
      const pr = perspProject(cam, geo.wverts[i]);
      if (pr.clip) return null;
      sx[i] = pr.x;
      sy[i] = pr.y;
    }
  }
  return { entry: { geo }, sx, sy };
}

function renderAll() {
  for (const p of Object.values(panels)) {
    if (fullPanel && p.name !== fullPanel) continue;
    renderPanel(p);
  }
  dirty = false;
}
function invalidate() { dirty = true; }
(function raf() {
  if (dirty) renderAll();
  requestAnimationFrame(raf);
})();

// ---- hit test -------------------------------------------------------------

function pointInLoop(pp, f, mx, my) {
  const mesh = pp.entry.geo.mesh;
  const loopStart = mesh.faces[f][2], loopCount = mesh.faces[f][3];
  let inside = false;
  for (let k = 0, j = loopCount - 1; k < loopCount; j = k++) {
    const a = mesh.faceVerts[loopStart + k], b = mesh.faceVerts[loopStart + j];
    const ax = pp.sx[a], ay = pp.sy[a], bx = pp.sx[b], by = pp.sy[b];
    if ((ay > my) !== (by > my) && mx < (bx - ax) * (my - ay) / (by - ay) + ax)
      inside = !inside;
  }
  return inside;
}

// nearest front face containing the point wins (walk the painter list from
// near to far); edge-on faces in ortho panels pick by segment proximity
function pickPart(p, cam, mx, my) {
  const { list } = buildDrawList(p, cam, project.parts);
  for (let i = list.length - 1; i >= 0; --i) {
    const rec = list[i];
    if (!faceAnyFront(rec.pp, rec.f)) {
      if (p.kind === "ortho" && faceEdgeOn(rec.pp, rec.f) &&
          nearLoop(rec.pp, rec.f, mx, my, 4)) return rec.pp.part;
      continue;
    }
    if (pointInLoop(rec.pp, rec.f, mx, my)) return rec.pp.part;
  }
  return null;
}

// ---- gumball --------------------------------------------------------------
// Rhino-style manipulator on the selected part, drawn in the part's OWN
// frame (its model axes — the same axes the X/Y/Z tap-locks use): three
// shaft arrows move along an axis, three arcs rotate about it (composed on
// the right, R' = R·Raxis, so the grabbed arc stays put), three squares
// scale one axis (Shift while dragging a square scales all three axes
// uniformly), and the center dot is the panel's free move. Constant screen
// size. No red/green/blue exists in this colorscheme, so the axes are told
// apart by lowercase letters at the arrow tips; hover and the active handle
// highlight in secondary, the same language as selection (with Shift held,
// every scale square lights up to signal uniform mode).

const GB = { SHAFT: 46, TIP: 54, SQ: 30, SQH: 3.5, ARC: 40, CENTER: 4, ARCSEG: 24 };

function computeGumball(p, cam, part) {
  const o = part.position;
  const proj = (v) => {
    if (p.kind === "ortho") return orthoToScreen(p, v);
    const pr = perspProject(cam, v);
    return pr.clip ? null : [pr.x, pr.y];
  };
  const so = proj(o);
  if (!so) return null;
  // pixels per world unit at the part origin (screen-constant widget size)
  let ppw;
  if (p.kind === "ortho") ppw = p.zoom;
  else {
    const z = dot3(cam.basis.f, sub3(o, cam.eye));
    if (z < NEAR) return null;
    ppw = cam.f / z;
  }
  const R = C.eulerXYZ(part.rotation[0], part.rotation[1], part.rotation[2]);
  const axesW = [[R[0], R[3], R[6]], [R[1], R[4], R[7]], [R[2], R[5], R[8]]];
  const axes = [];
  for (let a = 0; a < 3; ++a) {
    const w = axesW[a];
    const shaftEnd = proj(add3(o, mul3(w, GB.SHAFT / ppw)));
    const entry = { w, shaftEnd: null, dir: null, pxPerWorld: 0, sq: null, tip: null, arc: null };
    if (shaftEnd) {
      const dx = shaftEnd[0] - so[0], dy = shaftEnd[1] - so[1];
      const len = Math.hypot(dx, dy);
      if (len > 10) {  // axis not hopelessly foreshortened
        entry.shaftEnd = shaftEnd;
        entry.dir = [dx / len, dy / len];
        entry.pxPerWorld = len / (GB.SHAFT / ppw);
        entry.sq = proj(add3(o, mul3(w, GB.SQ / ppw)));
        entry.tip = [so[0] + entry.dir[0] * GB.TIP, so[1] + entry.dir[1] * GB.TIP];
      }
    }
    // the rotation arc: the true 3D circle around axis a, spanned by the
    // part's other two model axes, projected (an ellipse on screen)
    const u = axesW[(a + 1) % 3], v = axesW[(a + 2) % 3];
    const r = GB.ARC / ppw;
    const pts = [];
    for (let k = 0; k <= GB.ARCSEG; ++k) {
      const t = 2 * Math.PI * k / GB.ARCSEG;
      const pt = proj(add3(o, add3(mul3(u, r * Math.cos(t)), mul3(v, r * Math.sin(t)))));
      if (!pt) { pts.length = 0; break; }
      pts.push(pt);
    }
    if (pts.length) entry.arc = pts;
    axes.push(entry);
  }
  return { so, ppw, axes };
}

function distToSegment(mx, my, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((mx - ax) * dx + (my - ay) * dy) / len2 : 0;
  t = Math.min(1, Math.max(0, t));
  return Math.hypot(ax + t * dx - mx, ay + t * dy - my);
}

// nearest handle under the cursor, or null. Precedence: the center dot,
// then scale squares (they sit on the shafts), shafts, arcs.
function hitGumball(gb, mx, my) {
  if (!gb) return null;
  if (Math.hypot(mx - gb.so[0], my - gb.so[1]) <= GB.CENTER + 3) return { type: "center" };
  const A = "xyz";
  for (let a = 0; a < 3; ++a) {
    const e = gb.axes[a];
    if (e.sq && Math.abs(mx - e.sq[0]) <= GB.SQH + 3 && Math.abs(my - e.sq[1]) <= GB.SQH + 3)
      return { type: "scale", axis: a, key: A[a] };
  }
  for (let a = 0; a < 3; ++a) {
    const e = gb.axes[a];
    if (e.shaftEnd && distToSegment(mx, my, gb.so[0], gb.so[1], e.shaftEnd[0], e.shaftEnd[1]) <= 5)
      return { type: "move", axis: a, key: A[a] };
  }
  for (let a = 0; a < 3; ++a) {
    const e = gb.axes[a];
    if (!e.arc) continue;
    for (let k = 0; k + 1 < e.arc.length; ++k)
      if (distToSegment(mx, my, e.arc[k][0], e.arc[k][1], e.arc[k + 1][0], e.arc[k + 1][1]) <= 5)
        return { type: "rotate", axis: a, key: A[a] };
  }
  return null;
}

let gumballHover = null;  // { type, axis? } while the cursor rests on a handle
let shiftDown = false;    // uniform-scale modifier state (for the highlight)

function sameGumballHit(a, b) {
  return (!a && !b) || (a && b && a.type === b.type && a.axis === b.axis);
}

function drawGumball(ctx, gb, active) {
  const hot = (type, a) =>
    (active && active.type === type && active.axis === a) ||
    (!active && gumballHover && gumballHover.type === type && gumballHover.axis === a);
  // Shift + a scale handle (hovered or dragging) = uniform: all squares hot
  const uniformScale = shiftDown &&
      ((active && active.type === "scale") ||
       (!active && gumballHover && gumballHover.type === "scale"));
  const LETTER = "xyz";
  // arcs first (underneath)
  for (let a = 0; a < 3; ++a) {
    const e = gb.axes[a];
    if (!e.arc) continue;
    const h = hot("rotate", a);
    ctx.strokeStyle = h ? COL.ink : COL.secondary;
    ctx.lineWidth = h ? 2 : 1.25;
    ctx.globalAlpha = h ? 1 : 0.75;
    ctx.beginPath();
    for (let k = 0; k < e.arc.length; ++k) {
      if (k === 0) ctx.moveTo(e.arc[k][0], e.arc[k][1]);
      else ctx.lineTo(e.arc[k][0], e.arc[k][1]);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (let a = 0; a < 3; ++a) {
    const e = gb.axes[a];
    if (!e.shaftEnd) continue;
    const hMove = hot("move", a);
    ctx.strokeStyle = hMove ? COL.secondary : COL.ink;
    ctx.lineWidth = hMove ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.moveTo(gb.so[0], gb.so[1]);
    ctx.lineTo(e.shaftEnd[0], e.shaftEnd[1]);
    ctx.stroke();
    // axis letter at the arrow tip — the colorscheme's stand-in for RGB axes
    ctx.fillStyle = hMove ? COL.secondary : COL.ink;
    ctx.font = "italic bold 11px 'Times New Roman', Times, serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(LETTER[a], e.tip[0], e.tip[1]);
    // scale square partway along the shaft
    if (e.sq) {
      const hSq = hot("scale", a) || uniformScale;
      ctx.fillStyle = hSq ? COL.secondary : COL.paper;
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(e.sq[0] - GB.SQH, e.sq[1] - GB.SQH);
      ctx.lineTo(e.sq[0] + GB.SQH, e.sq[1] - GB.SQH);
      ctx.lineTo(e.sq[0] + GB.SQH, e.sq[1] + GB.SQH);
      ctx.lineTo(e.sq[0] - GB.SQH, e.sq[1] + GB.SQH);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
  // center dot: the panel's free move
  const hC = hot("center");
  ctx.fillStyle = hC ? COL.ink : COL.secondary;
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(gb.so[0], gb.so[1], GB.CENTER, 0, 2 * Math.PI);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.textAlign = "start";
  ctx.textBaseline = "alphabetic";
}

// ---- molding brush --------------------------------------------------------
// the mold tool paints dabs onto the SELECTED part: raycast the cursor onto
// the live (already-displaced) surface, pull the hit back to the BASE
// surface (hit.baseLocal — dabs must anchor where applyMold measures
// falloff, or sculpted regions outrun the brush and go dead), and let the
// core's displacement field do the rest. A drag is a stroke — dabs land
// every quarter-brush of surface travel, spaced on the live surface. Alt
// indents instead of extruding (sampled at mousedown, like every drag
// kind). One stroke = one undo gesture through the shared drag machinery.

const len3 = (v) => Math.hypot(v[0], v[1], v[2]);

// a world-space ray through the cursor for any panel (ortho rays start far
// behind the viewport plane and run along forward)
function panelRay(p, cam, mx, my) {
  if (p.kind === "persp") return perspRay(p, cam, mx, my);
  return { origin: sub3(orthoFromScreen(p, mx, my), mul3(p.forward, 1000)),
           dir: p.forward.slice() };
}

// nearest hit on the part's live surface; the hit also carries baseLocal,
// the pull-back to the un-displaced surface where dabs anchor (core
// raycastMoldSurface)
function raycastPartWorld(part, ray) {
  const entry = getGeo(part);
  return entry.geo ? C.raycastMoldSurface(entry.geo, ray) : null;
}

function round6(v) { return Math.round(v * 1e6) / 1e6; }

function applyMoldDab(d, hit) {
  const part = d.part;
  if (!part.mold || !Array.isArray(part.mold.dabs)) part.mold = { dabs: [] };
  // brush size/strength are world units; dabs live in local space — convert
  // by the mean scale (slightly anisotropic under non-uniform scale)
  const m = (part.scale[0] + part.scale[1] + part.scale[2]) / 3;
  const local = hit.baseLocal;
  part.mold.dabs.push({
    at: [round6(local[0]), round6(local[1]), round6(local[2])],
    r: Math.max(1e-4, round6(brushSize / m)),
    s: round6((d.invert ? -1 : 1) * brushStrength / m),
  });
  d.lastDabAt = hit.point;
  d.mutated = true;
  touch(part);
  invalidate();
}

// clay-style accumulation: while the button is held, a timer keeps
// deepening the most recent dab at a fraction of the brush strength per
// tick. The displacement field is linear in s, so growing the last dab's s
// is exactly equivalent to stacking dabs — a stationary hold stays ONE
// project-file entry however long you dwell. Moving still lays full-
// strength dabs by surface distance (a slow stroke digs slightly deeper
// than a fast one — clay behavior).
const MOLD_TICK_MS = 80;
const MOLD_ACCUM = 0.25;  // per-tick fraction of brush strength

function accumulateLastDab(d) {
  const dabs = C.moldedDabs(d.part);
  if (!dabs) return;
  const part = d.part;
  const m = (part.scale[0] + part.scale[1] + part.scale[2]) / 3;
  const last = dabs[dabs.length - 1];
  last.s = round6(last.s + (d.invert ? -1 : 1) * MOLD_ACCUM * brushStrength / m);
  d.mutated = true;
  touch(part);
  invalidate();
}

function beginMoldDrag(p, cam, part, hit, e) {
  const d = { kind: "mold", panel: p, cam, part,
              preState: snapshot(), mutated: false,
              lastDabAt: null, invert: e.altKey };
  applyMoldDab(d, hit);
  d.timer = setInterval(() => {
    if (drag !== d) { clearInterval(d.timer); return; }
    accumulateLastDab(d);
  }, MOLD_TICK_MS);
  return d;
}

// the on-screen brush circle: centered on the surface hit when there is
// one (radius converted at that depth), faint at the raw cursor otherwise
function computeMoldCursor(p, cam, mx, my) {
  const sel = selectedPart();
  let onSurface = false, x = mx, y = my, ppw;
  if (p.kind === "ortho") {
    ppw = p.zoom;
  } else {
    const z0 = dot3(cam.basis.f, sub3(p.target, cam.eye));
    ppw = cam.f / Math.max(z0, NEAR);
  }
  if (sel) {
    const hit = raycastPartWorld(sel, panelRay(p, cam, mx, my));
    if (hit) {
      onSurface = true;
      if (p.kind === "ortho") {
        const s = orthoToScreen(p, hit.point);
        x = s[0];
        y = s[1];
      } else {
        const pr = perspProject(cam, hit.point);
        if (!pr.clip) {
          x = pr.x;
          y = pr.y;
          ppw = cam.f / pr.z;
        }
      }
    }
  }
  return { panel: p.name, x, y, rpx: Math.max(2, brushSize * ppw), onSurface };
}

// ---- toolbar / strip ------------------------------------------------------

const $ = (id) => document.getElementById(id);
const stripName = document.createElement("input");
stripName.id = "pname";
stripName.title = "model name (drives the exported file, symbol, and snippet)";
stripName.style.width = "90px";
stripName.style.fontFamily = "inherit";
stripName.style.fontSize = "12px";
stripName.style.color = COL.ink;
stripName.style.background = COL.paper;
stripName.style.border = `1px solid ${COL.secondary}`;
stripName.style.borderRadius = "1px";
stripName.style.padding = "0 3px";
$("bexport").after(stripName);
stripName.value = project.name;
stripName.addEventListener("keydown", (e) => {
  if (e.key === "Enter") stripName.blur();
  e.stopPropagation();
});
stripName.addEventListener("change", () => {
  const name = stripName.value.trim();
  if (!name || name === project.name) { stripName.value = project.name; return; }
  pushUndo();
  project.name = name;
});

function syncStripButtons() {
  $("bmode").textContent = shadedMode ? "shaded" : "wireframe";
  $("bsnap").textContent = project.snap ? "snap on" : "snap off";
  stripName.value = project.name;
}

function download(fileName, text) {
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$("bnew").addEventListener("click", () => {
  if (project.parts.length && !confirm("start a new scene? unsaved changes are lost."))
    return;
  project = C.newProject();
  selectedId = null;
  armedType = null;
  undoStack.length = 0;
  redoStack.length = 0;
  syncStripButtons();
  syncArmedButtons();
  refreshNumeric();
  refreshBudget();
  invalidate();
});

$("bopen").addEventListener("click", () => {
  // opening discards the scene and its undo history, exactly like [new]
  if (project.parts.length && !confirm("open a project? unsaved changes are lost."))
    return;
  const inp = $("openfile");
  inp.value = "";
  inp.click();
});
$("openfile").addEventListener("change", () => {
  const file = $("openfile").files[0];
  if (!file) return;
  file.text().then((text) => {
    try {
      const p = C.parseProjectText(text);
      project = p;
      selectedId = null;
      armedType = null;
      undoStack.length = 0;
      redoStack.length = 0;
      syncStripButtons();
      syncArmedButtons();
      refreshNumeric();
      refreshBudget();
      invalidate();
    } catch (e) {
      alert("open failed: " + e.message);
    }
  });
});

$("bsave").addEventListener("click", () => {
  download(C.cIdentifier(project.name) + ".json", C.serializeProject(project) + "\n");
});

$("bexport").addEventListener("click", () => {
  const baked = C.bake(project);
  if (!baked.ok) { alert(baked.error); return; }
  if (baked.overlaps.length) {
    const pairs = baked.overlaps.map(([a, b]) => `${a.id} (${a.type}) <-> ${b.id} (${b.type})`);
    alert("note: interpenetrating parts — the painter's algorithm cannot resolve " +
          "interpenetrating geometry on device, so these may draw in the wrong " +
          "order:\n  " + pairs.join("\n  ") + "\n\nexporting anyway.");
  }
  const hdr = C.emitHeader(project, baked);
  download(hdr.fileName, hdr.text);
});

$("resetview").addEventListener("click", () => {
  for (const p of Object.values(panels)) {
    if (p.kind === "persp") {
      p.az = PERSP_HOME.az;
      p.orbitEl = PERSP_HOME.orbitEl;
      p.dist = PERSP_HOME.dist;
      p.target = PERSP_HOME.target.slice();
    } else {
      Object.assign(p, ORTHO_HOME);
    }
  }
  invalidate();
});

$("bmode").addEventListener("click", () => {
  shadedMode = !shadedMode;
  syncStripButtons();
  invalidate();
});
$("bsnap").addEventListener("click", () => {
  project.snap = !project.snap;
  syncStripButtons();
});

// space must never re-trigger the last-clicked button
document.addEventListener("click", (e) => {
  if (e.target instanceof HTMLButtonElement) e.target.blur();
});

// ---- budget line ----------------------------------------------------------

function refreshBudget() {
  const el = $("budget");
  if (!project.parts.length) { el.textContent = ""; return; }
  const c = C.countsOf(project.parts);
  const b = C.budgetOf(c);
  el.textContent = `${c.nv} v · ${c.nt} t · ${c.nf} f · ` +
                   `${(b.flash / 1024).toFixed(1)} KB`;
  el.title = `flash ${b.flash} B · renderer RAM ${b.ram} B` +
             (b.over.length ? "\nOVER CAP:\n" + b.over.join("\n") : "");
  el.classList.toggle("hot", b.hot || b.over.length > 0);
}

// ---- primitive menu -------------------------------------------------------

const primButtons = {};
for (const type of C.PRIM_ORDER) {
  const btn = document.createElement("button");
  btn.textContent = type;
  btn.addEventListener("click", () => {
    if (tool !== "select") {  // placement lives in the select tool
      tool = "select";
      moldCursor = null;
      syncToolButtons();
    }
    armedType = armedType === type ? null : type;
    ghost = null;
    syncArmedButtons();
    invalidate();
    btn.blur();
  });
  $("prims").appendChild(btn);
  primButtons[type] = btn;
}
function syncArmedButtons() {
  for (const [type, btn] of Object.entries(primButtons))
    btn.classList.toggle("armed", type === armedType);
  for (const p of Object.values(panels))
    p.el.classList.toggle("armed", !!armedType || tool === "mold");
}

// ---- tools section (select / mold + brush controls) -----------------------

const toolButtons = {};
for (const t of ["select", "mold"]) {
  const btn = document.createElement("button");
  btn.textContent = t;
  btn.addEventListener("click", () => {
    setTool(t === tool && t !== "select" ? "select" : t);
    btn.blur();
  });
  $("tools").appendChild(btn);
  toolButtons[t] = btn;
}
function setTool(t) {
  tool = t;
  if (t !== "select") {
    armedType = null;
    ghost = null;
  }
  gumballHover = null;
  moldCursor = null;
  syncToolButtons();
  syncArmedButtons();
  invalidate();
}
function syncToolButtons() {
  for (const [t, btn] of Object.entries(toolButtons))
    btn.classList.toggle("armed", t === tool);
  brushPanel.style.display = tool === "mold" ? "" : "none";
}

// brush controls: log-scaled sliders (fine control at the small end) with a
// live value readout, shown only while the mold tool is active
const brushPanel = document.createElement("div");
brushPanel.id = "brush";
brushPanel.style.display = "none";
$("tools").appendChild(brushPanel);

const BRUSH_SIZE_RANGE = [0.02, 2];
const BRUSH_STRENGTH_RANGE = [0.005, 0.5];

function brushSlider(labelText, range, get, set) {
  const [min, max] = range;
  const row = document.createElement("div");
  row.className = "brow";
  const label = document.createElement("label");
  const inp = document.createElement("input");
  inp.type = "range";
  inp.min = "0";
  inp.max = "100";
  inp.step = "1";
  const sync = () => {
    label.textContent = `${labelText} ${fmtNum(get(), 2)}`;
    inp.value = String(Math.round(100 * Math.log(get() / min) / Math.log(max / min)));
  };
  inp.addEventListener("input", () => {
    set(min * Math.pow(max / min, parseFloat(inp.value) / 100));
    label.textContent = `${labelText} ${fmtNum(get(), 2)}`;
    invalidate();
  });
  inp.addEventListener("change", () => inp.blur());
  row.appendChild(label);
  row.appendChild(inp);
  brushPanel.appendChild(row);
  sync();
  return { sync };
}
const sizeSlider = brushSlider("size", BRUSH_SIZE_RANGE,
    () => brushSize,
    (v) => {
      if (moldCursor) moldCursor.rpx = Math.max(2, moldCursor.rpx * v / brushSize);
      brushSize = v;
    });
const strengthSlider = brushSlider("strength", BRUSH_STRENGTH_RANGE,
    () => brushStrength,
    (v) => { brushStrength = v; });
function syncBrushInputs() {
  sizeSlider.sync();
  strengthSlider.sync();
}

// ---- numeric panel --------------------------------------------------------

const np = $("numpanel");
// the built panel: the part object it was built for plus every input with
// its value getter, so commits and drag-ends refresh values in place — a
// full DOM rebuild would destroy the input a Tab keypress is moving into
let npState = null;  // { part, entries: [{ input, get }] }

function fmtNum(v, digits) {
  return String(parseFloat(v.toFixed(digits === undefined ? 4 : digits)));
}

function numRow(labelText, inputs) {
  const row = document.createElement("div");
  row.className = "nprow" + (inputs.length > 1 ? " nptriple" : "");
  if (labelText) {
    const label = document.createElement("label");
    label.textContent = labelText;
    row.appendChild(label);
  }
  for (const i of inputs) row.appendChild(i);
  return row;
}

// numeric commits are one undo gesture each (Enter/blur with a changed value)
function numInput(entries, get, apply) {
  const inp = document.createElement("input");
  inp.value = get();
  entries.push({ input: inp, get });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") inp.blur();
    e.stopPropagation();  // field keys never reach the global handler
  });
  inp.addEventListener("change", () => {
    const v = parseFloat(inp.value);
    if (!isFinite(v)) { refreshNumeric(); return; }
    const pre = snapshot();
    if (apply(v)) { pushUndo(pre); refreshBudget(); invalidate(); }
    refreshNumeric();
  });
  return inp;
}

function refreshNumeric() {
  const part = selectedPart();
  // same part object still shown -> update unfocused values in place. Any
  // change of identity (select, delete, undo's fresh objects) rebuilds.
  if (npState && part && npState.part === part) {
    for (const en of npState.entries)
      if (document.activeElement !== en.input) en.input.value = en.get();
    return;
  }
  npState = null;
  np.textContent = "";
  if (!part) return;  // no selection: the panel stays empty
  const entries = [];
  const title = document.createElement("div");
  title.className = "nptitle";
  title.textContent = `${part.type} · ${part.id}`;
  np.appendChild(title);

  const sect = (t) => {
    const d = document.createElement("div");
    d.className = "npsect";
    d.textContent = t;
    np.appendChild(d);
  };

  // native constructor params (tessellation control lives here — D12)
  for (const spec of C.PRIMS[part.type].params) {
    const inp = numInput(entries, () => fmtNum(part.params[spec.k]), (v) => {
      const nv = spec.int ? Math.max(1, Math.floor(v)) : v;
      const trial = { ...part.params, [spec.k]: nv };
      if (C.generate(part.type, trial).nverts === 0) {
        alert(`invalid ${spec.k}: the ${part.type} generator rejects it`);
        return false;
      }
      part.params = trial;
      touch(part);
      return true;
    });
    np.appendChild(numRow(spec.k, [inp]));
  }

  const triple = (label, get, apply) => {
    sect(label);
    const inputs = [0, 1, 2].map((axis) =>
      numInput(entries, () => get(axis), (v) => apply(axis, v)));
    np.appendChild(numRow("", inputs));
  };
  triple("position", (a) => fmtNum(part.position[a]), (a, v) => {
    part.position[a] = v;
    touch(part);
    return true;
  });
  // stored radians, displayed degrees (D6)
  triple("rotation °", (a) => fmtNum(part.rotation[a] * 180 / Math.PI, 2), (a, v) => {
    part.rotation[a] = v * Math.PI / 180;
    touch(part);
    return true;
  });
  triple("scale", (a) => fmtNum(part.scale[a]), (a, v) => {
    if (!(v >= C.MIN_SCALE)) {
      alert("scale must be positive (mirroring would flip the winding; rotation reaches every mirrored pose)");
      return false;
    }
    part.scale[a] = v;
    touch(part);
    return true;
  });
  npState = { part, entries };
}

// ---- placement / selection / drag gestures --------------------------------

function panelMouse(p, e) {
  const rect = p.el.getBoundingClientRect();
  return [e.clientX - rect.left, e.clientY - rect.top];
}

function snapPos(v) { return snapTo(v, SNAP_POS); }

function placementPoint(p, cam, mx, my, alt) {
  let pos = null;
  if (p.kind === "ortho") {
    pos = orthoFromScreen(p, mx, my);
  } else {
    const hit = groundHit(p, perspRay(p, cam, mx, my), 0, false);
    if (!hit) return null;  // ghost pins to the last valid point; click no-ops
    pos = hit;
  }
  if (project.snap && !alt) pos = pos.map(snapPos);
  return pos;
}

// model axis direction (world space) of the part's local axis a — the axis
// lock is a model-axis lock: a world-axis stretch of a rotated part is
// inexpressible pre-rotation, and the numeric panel is the tool for that.
function modelAxisDir(rot, a) {
  const R = C.eulerXYZ(rot[0], rot[1], rot[2]);
  return [R[a], R[3 + a], R[6 + a]];
}

// clone a part in place (fresh id, identical transform) and select it —
// shared by Ctrl/Cmd+D (which then offsets one snap step) and the
// Ctrl/Cmd+drag duplicate gesture (which drags the copy out).
function cloneInPlace(part) {
  const dup = C.mintPart(project, part.type);
  dup.params = { ...part.params };
  dup.position = part.position.slice();
  dup.rotation = part.rotation.slice();
  dup.scale = part.scale.slice();
  const dabs = C.moldedDabs(part);
  if (dabs) dup.mold = { dabs: dabs.map((d) => ({ at: d.at.slice(), r: d.r, s: d.s })) };
  project.parts.push(dup);
  selectedId = dup.id;
  return dup;
}

function beginDrag(p, cam, part, mx, my, e, kindOverride) {
  const kind = kindOverride ||
      (keysDown.has("r") ? "rotate" : keysDown.has("s") ? "scale" : "move");
  const d = {
    kind, panel: p, cam,
    part,
    startMx: mx, startMy: my,
    preState: snapshot(),
    origPos: part.position.slice(),
    origRot: part.rotation.slice(),
    origScale: part.scale.slice(),
    axis: null,          // 'x' | 'y' | 'z' model-axis lock (X/Y/Z taps)
    mutated: false,
  };
  if (kind === "rotate") {
    // drag angle around the part's projected center; perpendicular axis per
    // panel (perspective: world Y — driven by horizontal drag instead)
    let cx, cy;
    if (p.kind === "ortho") [cx, cy] = orthoToScreen(p, part.position);
    else {
      const pr = perspProject(cam, part.position);
      if (pr.clip) return null;
      cx = pr.x;
      cy = pr.y;
    }
    d.centerX = cx;
    d.centerY = cy;
    d.startAngle = Math.atan2(-(my - cy), mx - cx);
  }
  if (kind === "move" && p.kind === "persp") {
    // delta-based: the part moves by the ray-hit delta in the horizontal
    // plane y = part.y — elevation preserved, no grab-jump
    const hit = groundHit(p, perspRay(p, cam, mx, my), part.position[1], true);
    if (!hit) return null;
    d.grab = hit;
  }
  return d;
}

// a gumball handle drag: the handle fixes both the kind and the model axis
// at mousedown; the gesture machinery (preState, mutated, Esc-abort, undo
// push at mouseup) is shared with the modifier-key drags.
function beginGumballDrag(p, cam, part, gb, hit, mx, my) {
  const e = gb.axes[hit.axis];
  const d = {
    kind: "g" + hit.type,  // gmove | grotate | gscale
    gumball: hit,
    panel: p, cam, part,
    startMx: mx, startMy: my,
    preState: snapshot(),
    origPos: part.position.slice(),
    origRot: part.rotation.slice(),
    origScale: part.scale.slice(),
    axis: null,
    mutated: false,
    gAxisW: e.w.slice(),
    gDir: e.dir ? e.dir.slice() : null,
    gPxPerWorld: e.pxPerWorld,
  };
  if (hit.type === "rotate") {
    d.centerX = gb.so[0];
    d.centerY = gb.so[1];
    d.startAngle = Math.atan2(-(my - gb.so[1]), mx - gb.so[0]);
    // apparent screen direction of a +theta model-axis rotation follows the
    // side of the screen plane the axis points to (same rule the panel
    // rotations commit to): screen-CCW = +theta iff the axis runs with the
    // view's forward direction
    const fwd = p.kind === "ortho" ? p.forward : cam.basis.f;
    d.gSign = dot3(e.w, fwd) >= 0 ? 1 : -1;
  } else if (!d.gDir) {
    return null;  // foreshortened axis carries no move/scale handle
  }
  return d;
}

function updateDrag(e) {
  const d = drag;
  const p = d.panel;
  const [mx, my] = panelMouse(p, e);
  const part = d.part;
  const alt = e.altKey;
  const snapOn = project.snap && !alt;

  if (d.kind === "mold") {
    // a stroke: raycast the live surface, lay a dab per quarter-brush of
    // surface travel; the cursor circle tracks the deforming surface
    const ray = panelRay(p, d.cam, mx, my);
    const hit = raycastPartWorld(d.part, ray);
    if (hit) {
      if (!d.lastDabAt || len3(sub3(hit.point, d.lastDabAt)) >= brushSize * 0.25)
        applyMoldDab(d, hit);
    }
    moldCursor = computeMoldCursor(p, d.cam || null, mx, my);
    invalidate();
    return;
  }
  if (d.kind === "gmove") {
    // distance along the handle's screen direction, converted to world
    // units at the mousedown baseline; snap quantizes the axis distance
    let dist = ((mx - d.startMx) * d.gDir[0] + (my - d.startMy) * d.gDir[1]) / d.gPxPerWorld;
    if (snapOn) dist = snapTo(dist, SNAP_POS);
    part.position = add3(d.origPos, mul3(d.gAxisW, dist));
  } else if (d.kind === "grotate") {
    const a = Math.atan2(-(my - d.centerY), mx - d.centerX);
    let theta = (a - d.startAngle) * d.gSign;
    if (snapOn) theta = snapTo(theta, SNAP_ROT);
    part.rotation = C.rotateEulerAboutModelAxis(d.origRot, "xyz"[d.gumball.axis], theta);
  } else if (d.kind === "gscale") {
    const f = Math.pow(2, ((mx - d.startMx) * d.gDir[0] + (my - d.startMy) * d.gDir[1]) / 100);
    const s = d.origScale.slice();
    if (e.shiftKey) {
      // Shift: uniform — the grabbed handle drives all three axes. Live per
      // move (recomputed from the mousedown baseline), so holding or
      // releasing Shift mid-drag switches modes without drift.
      for (let k = 0; k < 3; ++k) s[k] = Math.max(C.MIN_SCALE, d.origScale[k] * f);
    } else {
      s[d.gumball.axis] = Math.max(C.MIN_SCALE, d.origScale[d.gumball.axis] * f);
    }
    part.scale = s;
  } else if (d.kind === "move") {
    let pos;
    if (p.kind === "ortho") {
      const dwx = (mx - d.startMx) / p.zoom;
      const dwy = -(my - d.startMy) / p.zoom;
      const delta = add3(mul3(p.right, dwx), mul3(p.up, dwy));
      if (d.axis) {
        const dir = modelAxisDir(d.origRot, { x: 0, y: 1, z: 2 }[d.axis]);
        let dist = dot3(delta, dir);
        if (snapOn) dist = snapTo(dist, SNAP_POS);
        pos = add3(d.origPos, mul3(dir, dist));
      } else {
        pos = add3(d.origPos, delta);
        if (snapOn)
          for (let k = 0; k < 3; ++k)
            if (p.right[k] !== 0 || p.up[k] !== 0) pos[k] = snapPos(pos[k]);
      }
    } else {
      const hit = groundHit(p, perspRay(p, d.cam, mx, my), d.origPos[1], true);
      if (!hit) return;
      const delta = sub3(hit, d.grab);  // horizontal by construction
      if (d.axis) {
        const dir = modelAxisDir(d.origRot, { x: 0, y: 1, z: 2 }[d.axis]);
        let dist = dot3(delta, dir);
        if (snapOn) dist = snapTo(dist, SNAP_POS);
        pos = add3(d.origPos, mul3(dir, dist));
      } else {
        pos = add3(d.origPos, delta);
        if (snapOn) {
          pos[0] = snapPos(pos[0]);
          pos[2] = snapPos(pos[2]);
        }
      }
    }
    part.position = pos;
  } else if (d.kind === "rotate") {
    let theta;
    let axis, sign;
    if (p.kind === "persp") {
      axis = "y";
      theta = -(mx - d.startMx) * 0.01;
    } else {
      const a = Math.atan2(-(my - d.centerY), mx - d.centerX);
      const screenTheta = a - d.startAngle;
      // the panel triple (right, up, out-of-screen) is left-handed — the
      // bases commit to forward-into-scene (det +1) — so a screen-CCW drag
      // is +theta about the FORWARD axis: front +Z ('z', +1), side -X
      // ('x', -1), top -Y ('y', -1). Verified by marker math: on the front
      // panel Rz(+10°) moves the east marker to the north-east (CCW).
      if (p.name === "front") { axis = "z"; sign = 1; }
      else if (p.name === "side") { axis = "x"; sign = -1; }
      else { axis = "y"; sign = -1; }
      theta = sign * screenTheta;
    }
    if (snapOn) theta = snapTo(theta, SNAP_ROT);
    part.rotation = C.rotateEulerAboutAxis(d.origRot, axis, theta);
  } else if (d.kind === "scale") {
    // exponential, never center-relative; clamped to epsilon (D7)
    const f = Math.pow(2, (mx - d.startMx) / 100);
    const s = d.origScale.slice();
    if (d.axis) {
      const a = { x: 0, y: 1, z: 2 }[d.axis];
      s[a] = Math.max(C.MIN_SCALE, d.origScale[a] * f);
    } else {
      for (let k = 0; k < 3; ++k) s[k] = Math.max(C.MIN_SCALE, d.origScale[k] * f);
    }
    part.scale = s;
  }
  d.mutated = true;
  touch(part);
  invalidate();
}

function endDrag(commit) {
  const d = drag;
  drag = null;
  for (const p of Object.values(panels)) p.el.classList.remove("dragging");
  if (!d) return;
  if (d.timer) clearInterval(d.timer);  // stop mold accumulation on any exit
  if (!commit || !d.mutated) {
    if (d.mutated) {
      restore(d.preState);  // Esc aborts to the mousedown state
      // an aborted duplicate-drag removed the clone; select its source again
      if (d.dupSourceId && project.parts.some((q) => q.id === d.dupSourceId)) {
        selectedId = d.dupSourceId;
        refreshNumeric();
        invalidate();
      }
    }
    return;
  }
  pushUndo(d.preState);
  refreshNumeric();
  refreshBudget();
  invalidate();
}

for (const p of Object.values(panels)) {
  const canvas = p.canvas;
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  canvas.addEventListener("mousedown", (e) => {
    const [mx, my] = panelMouse(p, e);
    const cam = p.kind === "persp" ? perspCamera(p) : null;
    // Safari reports macOS Ctrl+click as button 2 — that combination is the
    // duplicate-drag gesture, never navigation, in every browser
    if (e.button === 2 && !e.ctrlKey) {
      if (drag) return;  // navigation is refused while a transform drag runs
      navDrag = { p, lastX: e.clientX, lastY: e.clientY };
      return;
    }
    if (e.button !== 0 && !(e.button === 2 && e.ctrlKey)) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    // Ctrl/Cmd + any transform drag performs it on a fresh duplicate — the
    // copy is minted at the original's transform and dragged out from under
    // it. Mint + drag commit as ONE undo step; Esc removes the copy whole.
    const wantDup = e.ctrlKey || e.metaKey;

    if (armedType) {
      // one click places one part and returns to select mode (D5)
      const pos = placementPoint(p, cam, mx, my, e.altKey);
      if (!pos) return;
      pushUndo();
      const part = C.mintPart(project, armedType);
      part.position = pos;
      project.parts.push(part);
      selectedId = part.id;
      armedType = null;
      ghost = null;
      syncArmedButtons();
      refreshNumeric();
      refreshBudget();
      invalidate();
      return;
    }

    if (tool === "mold") {
      const sel = selectedPart();
      if (sel) {
        const hit = raycastPartWorld(sel, panelRay(p, cam, mx, my));
        if (hit) {
          drag = beginMoldDrag(p, cam, sel, hit, e);
          p.el.classList.add("dragging");
          return;
        }
      }
      // off-surface click: plain selection, so you can switch parts mid-mold
      const pick = pickPart(p, cam, mx, my);
      if ((pick && pick.id) !== selectedId) {
        selectedId = pick ? pick.id : null;
        refreshNumeric();
        invalidate();
      }
      return;
    }

    // starts a drag on `part`, optionally on a fresh duplicate of it. The
    // clone shares the original's transform, so drag baselines (gumball
    // geometry included) computed from either are identical.
    const startDrag = (part, makeDrag) => {
      let pre = null, target = part;
      if (wantDup) {
        pre = snapshot();
        target = cloneInPlace(part);
        refreshNumeric();
        refreshBudget();
        invalidate();
      }
      const d = makeDrag(target);
      if (!d) {
        if (pre) {
          restore(pre);  // drag couldn't start: unwind the clone
          selectedId = part.id;  // back to the source part
          refreshNumeric();
          invalidate();
        }
        return;
      }
      if (pre) {
        d.preState = pre;      // one gesture: undo removes the copy + its move
        d.mutated = true;      // the mint itself already mutated the project
        d.dupSourceId = part.id;
      }
      drag = d;
      p.el.classList.add("dragging");
    };

    // the selected part's gumball takes the click before any picking —
    // its handles may float over empty space or other parts (Rhino rules)
    const gbPart = selectedPart();
    if (gbPart) {
      const gb = computeGumball(p, cam, gbPart);
      const gHit = hitGumball(gb, mx, my);
      if (gHit) {
        startDrag(gbPart, (target) => gHit.type === "center"
            ? beginDrag(p, cam, target, mx, my, e, "move")
            : beginGumballDrag(p, cam, target, gb, gHit, mx, my));
        return;
      }
    }

    const hitPart = pickPart(p, cam, mx, my);
    if (!hitPart) {
      if (selectedId !== null) {
        selectedId = null;
        refreshNumeric();
        invalidate();
      }
      return;
    }
    if (!wantDup && hitPart.id !== selectedId) {
      selectedId = hitPart.id;
      refreshNumeric();
      invalidate();
    }
    startDrag(hitPart, (target) => beginDrag(p, cam, target, mx, my, e));
  });

  canvas.addEventListener("mousemove", (e) => {
    if (armedType && !drag && !navDrag) {
      const [mx, my] = panelMouse(p, e);
      const cam = p.kind === "persp" ? perspCamera(p) : null;
      const pos = placementPoint(p, cam, mx, my, e.altKey);
      if (pos) ghost = { pos, valid: true };
      // an invalid perspective point pins the ghost where it last was
      invalidate();
    } else if (!drag && !navDrag) {
      const [mx, my] = panelMouse(p, e);
      const cam = p.kind === "persp" ? perspCamera(p) : null;
      if (tool === "mold") {
        moldCursor = computeMoldCursor(p, cam, mx, my);
        invalidate();
        return;
      }
      // gumball hover highlight
      const sel = selectedPart();
      const hit = sel ? hitGumball(computeGumball(p, cam, sel), mx, my) : null;
      if (!sameGumballHit(hit, gumballHover)) {
        gumballHover = hit;
        invalidate();
      }
    }
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    // a mid-drag zoom/dolly would rescale the gesture's accumulated delta
    // and desync the drag's cached camera — navigation waits its turn
    if (drag) return;
    const k = Math.exp(e.deltaY * 0.0015);
    if (p.kind === "ortho") {
      // zoom about the cursor: the world point under it stays put
      const [mx, my] = panelMouse(p, e);
      const before = orthoFromScreen(p, mx, my);
      p.zoom = Math.min(2000, Math.max(4, p.zoom / k));
      const after = orthoFromScreen(p, mx, my);
      p.panX += dot3(p.right, before) - dot3(p.right, after);
      p.panY += dot3(p.up, before) - dot3(p.up, after);
    } else {
      p.dist = Math.min(120, Math.max(0.5, p.dist * k));
    }
    invalidate();
  }, { passive: false });
}

window.addEventListener("mousemove", (e) => {
  lastMouse.x = e.clientX;
  lastMouse.y = e.clientY;
  if (navDrag) {
    const dx = e.clientX - navDrag.lastX, dy = e.clientY - navDrag.lastY;
    navDrag.lastX = e.clientX;
    navDrag.lastY = e.clientY;
    const p = navDrag.p;
    if (p.kind === "persp") {
      p.az -= dx * 0.01;
      p.orbitEl = Math.min(1.55, Math.max(-1.55, p.orbitEl + dy * 0.01));
    } else {
      p.panX -= dx / p.zoom;
      p.panY += dy / p.zoom;
    }
    invalidate();
    return;
  }
  if (drag) updateDrag(e);
});
window.addEventListener("mouseup", (e) => {
  if (e.button === 2) navDrag = null;
  // button 2 also ends transform drags: Safari delivers macOS Ctrl+drag
  // (the duplicate gesture) entirely as button-2 events
  if ((e.button === 0 || e.button === 2) && drag) endDrag(true);
});
window.addEventListener("blur", () => {
  keysDown.clear();
  shiftDown = false;
  navDrag = null;
  if (drag) endDrag(true);
});

// ---- keyboard -------------------------------------------------------------

function inTextField() {
  const el = document.activeElement;
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
}

// the hovered panel resolved geometrically against the last mousemove
// position — never from enter/leave events, which go stale when the layout
// swaps under a stationary cursor
function hoveredPanel() {
  for (const p of Object.values(panels)) {
    if (fullPanel && p.name !== fullPanel) continue;
    const r = p.el.getBoundingClientRect();
    if (lastMouse.x >= r.left && lastMouse.x < r.right &&
        lastMouse.y >= r.top && lastMouse.y < r.bottom) return p;
  }
  return null;
}

function toggleFullscreen() {
  if (drag || navDrag) return;  // refused while a drag is active
  const container = $("panels");
  if (fullPanel) {
    fullPanel = null;
    container.classList.remove("full");
    for (const p of Object.values(panels)) p.el.classList.remove("fullpanel");
  } else {
    const p = hoveredPanel();
    if (!p) return;
    fullPanel = p.name;
    container.classList.add("full");
    p.el.classList.add("fullpanel");
  }
  // the ResizeObserver fires on the layout swap and re-renders immediately
}

document.addEventListener("keydown", (e) => {
  // Shift state is tracked unconditionally (before the text-field guard) so
  // the uniform-scale highlight can never stick
  if (e.key === "Shift" && !shiftDown) {
    shiftDown = true;
    if ((gumballHover && gumballHover.type === "scale") ||
        (drag && drag.kind === "gscale")) invalidate();
  }
  if (inTextField()) return;  // Backspace edits the field, never deletes a part
  const key = e.key.toLowerCase();
  const mod = e.ctrlKey || e.metaKey;

  if (e.key === "Alt") { e.preventDefault(); return; }
  if (key === " ") {
    e.preventDefault();          // never scroll, never re-trigger a button
    if (!e.repeat) toggleFullscreen();
    return;
  }
  if (mod && key === "d") {
    e.preventDefault();
    const part = selectedPart();
    if (!part || drag) return;  // no mid-gesture snapshots (D11)
    pushUndo();
    const dup = cloneInPlace(part);
    dup.position[0] += SNAP_POS;  // offset one snap step
    refreshNumeric();
    refreshBudget();
    invalidate();
    return;
  }
  if (mod && key === "z") {
    e.preventDefault();
    if (drag) return;  // no history surgery mid-gesture
    if (e.shiftKey) doRedo();
    else doUndo();
    return;
  }
  if (mod) return;

  if (e.key === "Escape") {
    if (drag) { endDrag(false); return; }
    if (tool !== "select") { setTool("select"); return; }
    if (armedType) {
      armedType = null;
      ghost = null;
      syncArmedButtons();
      invalidate();
      return;
    }
    if (selectedId !== null) {
      selectedId = null;
      refreshNumeric();
      invalidate();
    }
    return;
  }
  // [ / ] resize the mold brush (sculpt-app muscle memory); the on-screen
  // circle rescales immediately, exact center refresh on the next move
  if (tool === "mold" && (e.key === "[" || e.key === "]")) {
    const next = Math.min(BRUSH_SIZE_RANGE[1],
        Math.max(BRUSH_SIZE_RANGE[0], brushSize * (e.key === "]" ? 1.25 : 0.8)));
    if (moldCursor) moldCursor.rpx = Math.max(2, moldCursor.rpx * next / brushSize);
    brushSize = next;
    syncBrushInputs();
    invalidate();
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace") {
    const part = selectedPart();
    if (!part || drag) return;
    pushUndo();
    project.parts = project.parts.filter((q) => q !== part);
    selectedId = null;
    refreshNumeric();
    refreshBudget();
    invalidate();
    return;
  }
  // X/Y/Z tap-lock refines the current drag (never changes its kind);
  // re-tapping the locked axis unlocks. A held key is one tap (!e.repeat).
  // Gumball drags carry their axis in the grabbed handle — no taps.
  if (drag && !e.repeat && (key === "x" || key === "y" || key === "z") &&
      (drag.kind === "move" || drag.kind === "scale")) {
    drag.axis = drag.axis === key ? null : key;
    return;
  }
  if (key === "r" || key === "s") keysDown.add(key);  // sampled at mousedown only
});
document.addEventListener("keyup", (e) => {
  if (e.key === "Alt") e.preventDefault();  // Alt keyup focuses menus otherwise
  if (e.key === "Shift" && shiftDown) {
    shiftDown = false;
    if ((gumballHover && gumballHover.type === "scale") ||
        (drag && drag.kind === "gscale")) invalidate();
  }
  keysDown.delete(e.key.toLowerCase());
});

// ---- dev parity page (#dev) -----------------------------------------------

function bootDev() {
  document.getElementById("app").style.display = "none";
  const dev = $("dev");
  dev.classList.add("on");
  dev.innerHTML = `
    <h1>generator parity — JS ports vs TD_Primitives.cpp</h1>
    <p>build and run <code>extras/dev/dump_primitives.cpp</code> (compile command
    in its header), then load the resulting <code>primitives_dump.json</code>.
    Indices must match exactly, floats to 1e-6.</p>
    <p><input type="file" id="devfile" accept=".json"></p>
    <div id="devout"></div>`;
  // file content is untrusted for innerHTML purposes: escape everything
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  $("devfile").addEventListener("change", () => {
    const inp = $("devfile");
    const f = inp.files[0];
    inp.value = "";  // re-selecting the same regenerated file must re-fire
    if (!f) return;
    f.text().then((text) => {
      try {
        const dump = JSON.parse(text);
        if (!dump || !Array.isArray(dump.cases))
          throw new Error("no cases[] array — is this really primitives_dump.json?");
        const res = C.diffPrimitives(dump);
        const rows = res.results.map((r) =>
          `<tr><td>${esc(r.name)}</td><td class="${r.ok ? "" : "fail"}">${r.ok ? "pass" : "FAIL"}</td>` +
          `<td>${r.problems.slice(0, 6).map(esc).join("<br>")}</td></tr>`).join("");
        $("devout").innerHTML =
          `<p><b>${res.ok ? "ALL CASES MATCH" : "MISMATCHES FOUND"}</b></p>` +
          `<table><tr><th>case</th><th>result</th><th>detail</th></tr>${rows}</table>`;
      } catch (e) {
        $("devout").textContent = "could not diff this file: " + e.message;
      }
    });
  });
}

// ---- boot -----------------------------------------------------------------

if (location.hash === "#dev") {
  bootDev();
} else {
  syncStripButtons();
  syncArmedButtons();
  syncToolButtons();
  refreshNumeric();
  refreshBudget();
  for (const p of Object.values(panels)) panelSize(p);
  invalidate();
}

// headless smoke-test handle: the dev harness boots this file against a DOM
// stub and asserts every panel draws finite coordinates (the class of bug a
// code review can't see: silent NaNs draw nothing and throw nothing).
window.__td = {
  panels, renderAll,
  loadProject(text) {
    project = C.parseProjectText(text);
    selectedId = null;
    refreshNumeric();
    refreshBudget();
    invalidate();
  },
  select(id) {
    selectedId = id;
    refreshNumeric();
    invalidate();
  },
};
})();
</script>
</body>
</html>
